<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Unbaloon</title>
  <meta name="description" content="A playful balloon-popping game for young children." />
  <meta name="theme-color" content="#87CEEB" />
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
  <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" sizes="180x180" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 100%);
      z-index: 10;
      gap: 32px;
      transition: opacity 0.4s ease;
    }
    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-title {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
      font-size: clamp(48px, 12vw, 96px);
      font-weight: bold;
      color: #fff;
      text-shadow:
        3px 3px 0 #FF4444,
        -2px -2px 0 #4488FF,
        2px -2px 0 #44BB44,
        -2px 2px 0 #FFD700;
      letter-spacing: 2px;
    }
    .start-btn {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
      font-size: clamp(24px, 6vw, 42px);
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #FF6B6B 0%, #FF4444 100%);
      border: none;
      border-radius: 50px;
      padding: 16px 64px;
      cursor: pointer;
      box-shadow:
        0 6px 0 #CC2222,
        0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #CC2222,
        0 3px 10px rgba(0,0,0,0.15);
    }
    .fullscreen-toggle {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
      font-size: clamp(14px, 3.5vw, 20px);
      color: #5588BB;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid rgba(85, 136, 187, 0.4);
      border-radius: 30px;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .fullscreen-toggle:active {
      background: rgba(255, 255, 255, 0.9);
    }
    .start-secondary-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .pwa-control.hidden,
    .install-panel.hidden,
    .update-prompt.hidden {
      display: none;
    }
    .install-panel {
      width: min(88vw, 420px);
      padding: 20px;
      border: 3px solid rgba(85, 136, 187, 0.35);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      color: #315f89;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
      font-size: clamp(16px, 4vw, 21px);
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 8px 24px rgba(49, 95, 137, 0.18);
    }
    .install-panel button {
      margin-top: 14px;
    }
    .update-prompt {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 20;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    #play-again-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 100%);
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #play-again-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <div class="start-title">Unbaloon</div>
    <button class="start-btn" id="start-btn">Play!</button>
    <div class="start-secondary-actions">
      <button class="fullscreen-toggle" id="fullscreen-btn">Fullscreen</button>
      <button class="fullscreen-toggle pwa-control hidden" id="install-btn">Install app</button>
    </div>
    <div class="install-panel hidden" id="ios-install-panel" role="dialog" aria-live="polite">
      <strong>Install Unbaloon</strong><br />
      Tap the Share button, then choose <strong>Add to Home Screen</strong>.
      <br />
      <button class="fullscreen-toggle" id="dismiss-ios-install-btn">Got it</button>
    </div>
  </div>
  <div id="play-again-screen" class="hidden">
    <button class="start-btn" id="play-again-btn">Play again!</button>
  </div>
  <button class="fullscreen-toggle update-prompt hidden" id="update-btn">
    Update available
  </button>
  <canvas id="game"></canvas>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
